name: Publish Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: quota-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Download pinned official engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force engine | Out-Null
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-app-server-x86_64-pc-windows-msvc.exe' -OutFile 'engine/codex-app-server-x86_64-pc-windows-msvc.exe'
      - name: Build complete package and verify contents
        shell: pwsh
        run: |
          ./build.ps1
          $version = ([xml](Get-Content source/Quota.csproj)).Project.PropertyGroup.Version
          $zip = "dist/Quota-v$version-Windows.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('Quota.exe','engine/codex-app-server-x86_64-pc-windows-msvc.exe','使用说明.txt')) {
              if ($required -notin $names) { throw "Missing package file: $required" }
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Quota-v$version-Windows.zip" | Set-Content dist/SHA256SUMS.txt
          "QUOTA_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:QUOTA_VERSION"
          $zip = "dist/Quota-$tag-Windows.zip"
          @"
          Windows 10/11 x64 完整程序包。下载 Quota-$tag-Windows.zip，全部解压后双击 Quota.exe；请保留 engine 文件夹。
          
          包含官方 Codex App Server 0.160.0，构建时已校验引擎 SHA256。
          修复引擎查找路径，提供拖动、侧边吸附、数值收起和托盘菜单。
          
          已通过 Windows 编译与压缩包完整性检查。尚未完成实机交互回归；Plus 升级 Pro 后的同步异常仍待排查，额度以官方页面为准。
          "@ | Set-Content release-notes.txt
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }
          gh release create $tag $zip dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Quota $tag · Windows 完整版" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
